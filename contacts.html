<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Surya S</title>

    <meta name="description"
        content="Contact Surya S to discuss software development, AI projects, collaboration, and technology opportunities.">

    <link rel="stylesheet" href="css/style.css">

</head>

<body><a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <header>
        <h2><a href="index.html">Surya.</a></h2>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <h1 id="contact-heading">Contact Me</h1>

            <p>
                Have a project idea or collaboration opportunity?
                Send me a message using the form below.
            </p>

            <form id="contact-form" action="#" method="get">

                <div class="form-group">
                    <label for="name">Full Name *</label>

                    <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-help">

                    <small id="name-help">
                        Enter your full name.
                    </small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>

                    <input type="email" id="email" name="email" autocomplete="email" required
                        aria-describedby="email-help">

                    <small id="email-help">
                        Enter a valid email address.
                    </small>
                </div>

                <div class="form-group">
                    <label for="subject">Subject *</label>

                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message *</label>

                    <textarea id="message" name="message" rows="6" required aria-describedby="message-help"></textarea>

                    <small id="message-help">
                        Explain how I can help you.
                    </small>
                </div>

                <button type="submit">Send Message</button>

                <p id="form-status" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Surya S. All rights reserved.</p>
    </footer>

    <script src="js/script.js" defer></script>

</body>

</html>
