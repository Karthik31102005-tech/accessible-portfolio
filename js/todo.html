<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/todo.js" defer></script>
</head>

<body>
    <header>
        <h2>My To-Do List</h2>
        <nav>
            <a href="index.html">Back to Portfolio</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Task Manager</h1>
            <p>Add tasks, edit them, complete them, or delete them.</p>

            <form id="task-form">
                <label for="task-input">New task</label>
                <input type="text" id="task-input" placeholder="Enter a task..." required maxlength="200">
                <button type="submit">Add Task</button>
            </form>

            <div>
                <button type="button" data-filter="all">All</button>
                <button type="button" data-filter="active">Active</button>
                <button type="button" data-filter="completed">Completed</button>
            </div>

            <p id="task-count" aria-live="polite">0 tasks remaining</p>
            <ul id="task-list"></ul>
            <p id="empty-message">No tasks yet. Add your first task!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My To-Do List</p>
    </footer>
</body>

</html>
